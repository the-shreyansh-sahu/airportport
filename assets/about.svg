<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Rich Dark Walnut Wood Grain Texture -->
    <pattern id="walnut-grain" width="600" height="600" patternUnits="userSpaceOnUse">
      <rect width="600" height="600" fill="#2d1c14"/>
      <!-- Soft organic grain lines -->
      <path d="M0 50 Q 150 40, 300 55 T 600 45" fill="none" stroke="#382319" stroke-width="12" opacity="0.6"/>
      <path d="M0 120 Q 200 135, 400 110 T 600 125" fill="none" stroke="#22140d" stroke-width="18" opacity="0.5"/>
      <path d="M0 200 Q 120 185, 350 215 T 600 195" fill="none" stroke="#3f271c" stroke-width="8" opacity="0.5"/>
      <path d="M0 290 Q 250 310, 420 275 T 600 295" fill="none" stroke="#1c0f09" stroke-width="22" opacity="0.65"/>
      <path d="M0 380 Q 180 365, 330 390 T 600 375" fill="none" stroke="#382319" stroke-width="14" opacity="0.6"/>
      <path d="M0 470 Q 220 485, 410 455 T 600 480" fill="none" stroke="#24150e" stroke-width="10" opacity="0.5"/>
      <path d="M0 550 Q 130 540, 310 560 T 600 545" fill="none" stroke="#3f271c" stroke-width="7" opacity="0.4"/>
    </pattern>

    <!-- Ambient Vignette & Lighting -->
    <radialGradient id="desk-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Warm Soft Spotlight Overlay -->
    <radialGradient id="desk-spotlight" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Material Gradients -->
    <linearGradient id="leather-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c221e"/>
      <stop offset="50%" stop-color="#1e1613"/>
      <stop offset="100%" stop-color="#120c0a"/>
    </linearGradient>

    <linearGradient id="leather-tan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b3e23"/>
      <stop offset="50%" stop-color="#542e18"/>
      <stop offset="100%" stop-color="#3b1f0e"/>
    </linearGradient>

    <linearGradient id="brass-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="ceramic-cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>

    <linearGradient id="espresso-rich" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#270e02"/>
      <stop offset="100%" stop-color="#0f0501"/>
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="gentle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="card-mounting-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="subtle-ring-blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- ================= DESK BACKGROUND ================= -->
  <rect width="1600" height="1000" fill="url(#walnut-grain)"/>
  <rect width="1600" height="1000" fill="url(#desk-spotlight)"/>
  <rect width="1600" height="1000" fill="url(#desk-vignette)"/>

  <!-- ================= TOP LEFT: CLASSIC TRAVEL JOURNAL & BRASS PEN ================= -->
  <g id="traveler-passport" transform="translate(130, 110) rotate(-14)" filter="url(#soft-shadow)">
    <!-- Leather Passport Cover -->
    <rect x="0" y="0" width="210" height="290" rx="12" fill="url(#leather-dark)"/>
    <rect x="0" y="0" width="210" height="290" rx="12" fill="none" stroke="#3b2b24" stroke-width="1.5"/>
    
    <!-- Fine Gold Foil Border -->
    <rect x="10" y="10" width="190" height="270" rx="8" fill="none" stroke="url(#brass-gold)" stroke-width="1" opacity="0.65"/>

    <!-- Gold Embossed Crest & Typography -->
    <text x="105" y="65" font-family="'Times New Roman', Times, Georgia, serif" font-size="13" font-weight="bold" fill="url(#brass-gold)" text-anchor="middle" letter-spacing="4" opacity="0.85">PASSPORT</text>

    <!-- Minimal Flying Wings Motif -->
    <g transform="translate(105, 140)" fill="none" stroke="url(#brass-gold)" stroke-width="1.5" stroke-linecap="round">
      <path d="M -30 -5 Q -10 -25 0 5 Q 10 -25 30 -5" opacity="0.85"/>
      <path d="M -22 5 Q -8 -10 0 12 Q 8 -10 22 5" opacity="0.7"/>
      <circle cx="0" cy="-6" r="3" fill="url(#brass-gold)" opacity="0.85"/>
    </g>

    <text x="105" y="235" font-family="'Times New Roman', Times, Georgia, serif" font-size="10" fill="url(#brass-gold)" text-anchor="middle" letter-spacing="3" opacity="0.75">TRAVELER</text>
  </g>

  <!-- Brass Pen Resting Next to Journal -->
  <g id="brass-pen" transform="translate(290, 240) rotate(32)" filter="url(#gentle-shadow)">
    <!-- Main Metal Barrel -->
    <rect x="0" y="0" width="14" height="310" rx="7" fill="url(#brass-gold)"/>
    <!-- Pen Clip -->
    <rect x="4" y="25" width="6" height="85" rx="2" fill="#fef08a"/>
    <circle cx="7" cy="110" r="4" fill="#d97706"/>
    <!-- Grip Rings -->
    <line x1="0" y1="210" x2="14" y2="210" stroke="#78350f" stroke-width="1"/>
    <line x1="0" y1="215" x2="14" y2="215" stroke="#78350f" stroke-width="1"/>
    <!-- Nib Base -->
    <path d="M 0 310 L 7 332 L 14 310 Z" fill="#451a03"/>
  </g>

  <!-- ================= TOP RIGHT: VINTAGE ITINERARY & GLASSES ================= -->
  <g id="itinerary-and-glasses" transform="translate(1220, 70) rotate(11)" filter="url(#gentle-shadow)">
    <!-- Folded Cream Itinerary Paper -->
    <g id="itinerary-paper">
      <rect x="0" y="0" width="270" height="360" rx="4" fill="#fafaf9"/>
      <!-- Soft Fold Shadow -->
      <line x1="0" y1="180" x2="270" y2="180" stroke="#e7e5e4" stroke-width="2"/>
      
      <!-- Minimalist Typography Lines -->
      <text x="30" y="45" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" fill="#44403c" letter-spacing="2">FLIGHT SCHEDULE</text>
      <line x1="30" y1="55" x2="240" y2="55" stroke="#d6d3d1" stroke-width="1"/>

      <!-- Simulated Flight Details -->
      <rect x="30" y="75" width="120" height="8" rx="2" fill="#a8a29e" opacity="0.6"/>
      <rect x="30" y="92" width="180" height="6" rx="2" fill="#d6d3d1"/>
      <rect x="30" y="106" width="150" height="6" rx="2" fill="#d6d3d1"/>

      <rect x="30" y="135" width="100" height="8" rx="2" fill="#a8a29e" opacity="0.6"/>
      <rect x="30" y="152" width="190" height="6" rx="2" fill="#d6d3d1"/>

      <rect x="30" y="210" width="130" height="8" rx="2" fill="#a8a29e" opacity="0.6"/>
      <rect x="30" y="227" width="160" height="6" rx="2" fill="#d6d3d1"/>
      <rect x="30" y="241" width="175" height="6" rx="2" fill="#d6d3d1"/>

      <!-- Brass Paperclip -->
      <path d="M 210 20 L 210 65 A 10 10 0 0 0 230 65 L 230 30 A 6 6 0 0 0 218 30 L 218 58" fill="none" stroke="url(#brass-gold)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Reading Glasses resting over paper -->
    <g id="spectacles" transform="translate(60, 100) rotate(-18)">
      <!-- Left Frame Rim -->
      <circle cx="50" cy="50" r="42" fill="none" stroke="#292524" stroke-width="3"/>
      <circle cx="50" cy="50" r="40" fill="#ffffff" opacity="0.1"/>
      
      <!-- Right Frame Rim -->
      <circle cx="150" cy="50" r="42" fill="none" stroke="#292524" stroke-width="3"/>
      <circle cx="150" cy="50" r="40" fill="#ffffff" opacity="0.1"/>

      <!-- Bridge -->
      <path d="M 92 46 Q 100 40 108 46" fill="none" stroke="#292524" stroke-width="3"/>

      <!-- Temple Arms -->
      <path d="M 8 50 Q -15 30 -35 15" fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 192 50 Q 215 30 235 15" fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Lens Reflections -->
      <path d="M 25 30 Q 50 15 65 35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
      <path d="M 125 30 Q 150 15 165 35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ================= BOTTOM LEFT: ESPRESSO CUP, SAUCER & SPRIG ================= -->
  <g id="coffee-corner" transform="translate(180, 780)">
    <!-- Coffee Ring Stain on Wood Surface -->
    <g transform="translate(-10, -10)" opacity="0.18" filter="url(#subtle-ring-blur)">
      <circle cx="0" cy="0" r="82" fill="none" stroke="#0f0501" stroke-width="10"/>
      <circle cx="5" cy="-3" r="76" fill="none" stroke="#1f0a02" stroke-width="4"/>
    </g>

    <g id="espresso-set" filter="url(#soft-shadow)">
      <!-- Wooden Coaster / Saucer Rim -->
      <circle cx="0" cy="0" r="92" fill="#3a2216" stroke="#24140c" stroke-width="2"/>
      <circle cx="0" cy="0" r="82" fill="none" stroke="#523220" stroke-width="1.5" opacity="0.6"/>

      <!-- Ceramic Cup Body -->
      <circle cx="0" cy="0" r="68" fill="url(#ceramic-cream)"/>
      <circle cx="0" cy="0" r="68" fill="none" stroke="#d6d3d1" stroke-width="1.5"/>

      <!-- Inner Liquid Coffee Base -->
      <circle cx="0" cy="0" r="56" fill="url(#espresso-rich)"/>

      <!-- Crema Foam Ring -->
      <circle cx="-6" cy="-4" r="38" fill="#a16207" opacity="0.35"/>
      <path d="M -15 -20 Q 15 -35 25 0 Q 5 25 -15 -20 Z" fill="#ca8a04" opacity="0.25"/>
      <circle cx="12" cy="10" r="4" fill="#f59e0b" opacity="0.3"/>

      <!-- Cup Handle Peak -->
      <rect x="64" y="-12" width="22" height="24" rx="7" fill="url(#ceramic-cream)"/>
    </g>

    <!-- Dried Lavender / Botanical Sprig Resting Nearby -->
    <g id="lavender-sprig" transform="translate(80, 40) rotate(-35)" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round">
      <path d="M 0 0 Q 40 -30 90 -50"/>
      <!-- Small Lavender Buds -->
      <circle cx="35" cy="-24" r="3.5" fill="#a855f7" stroke="none" opacity="0.75"/>
      <circle cx="48" cy="-31" r="4" fill="#8b5cf6" stroke="none" opacity="0.8"/>
      <circle cx="62" cy="-38" r="3.5" fill="#7c3aed" stroke="none" opacity="0.75"/>
      <circle cx="76" cy="-44" r="3" fill="#a855f7" stroke="none" opacity="0.7"/>
    </g>
  </g>

  <!-- ================= BOTTOM RIGHT: VINTAGE LEATHER SATCHEL ================= -->
  <g id="leather-bag-corner" transform="translate(1260, 680) rotate(-18)" filter="url(#soft-shadow)">
    <!-- Satchel Body Corner Peek -->
    <rect x="0" y="0" width="380" height="320" rx="20" fill="url(#leather-tan)"/>
    <rect x="0" y="0" width="380" height="320" rx="20" fill="none" stroke="#2a1508" stroke-width="2"/>

    <!-- Fine Edge Stitching -->
    <rect x="10" y="10" width="360" height="300" rx="14" fill="none" stroke="url(#brass-gold)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>

    <!-- Leather Flap Layer -->
    <path d="M 0 0 L 380 0 L 380 140 Q 190 180 0 140 Z" fill="#4a2713" stroke="#2a1508" stroke-width="1.5"/>

    <!-- Belt Strap & Brass Buckle -->
    <g transform="translate(180, 60)">
      <!-- Vertical Strap -->
      <rect x="-16" y="-60" width="32" height="180" rx="4" fill="#331a0c" stroke="#1f0f07" stroke-width="1"/>
      <rect x="-12" y="-56" width="24" height="172" fill="none" stroke="url(#brass-gold)" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

      <!-- Brass Buckle Frame -->
      <rect x="-26" y="40" width="52" height="42" rx="6" fill="none" stroke="url(#brass-gold)" stroke-width="5"/>
      <line x1="-20" y1="61" x2="20" y2="61" stroke="url(#brass-gold)" stroke-width="3"/>
    </g>
  </g>

  <!-- ================= SAFE CENTER ZONE FOR BOARDING PASS ================= -->
  <!-- 
    The middle book has been completely removed as requested.
    This center 860px x 380px horizontal area is completely open and ready 
    to host your horizontal boarding pass card component.
  -->
  <g id="boarding-pass-mount" transform="translate(370, 310)" filter="url(#card-mounting-shadow)">
    <!-- Subtle Dashed Outer Alignment Frame -->
    <rect x="-10" y="-10" width="880" height="400" rx="24" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3"/>

    <!-- Clean White Boarding Pass Placeholder Surface -->
    <rect x="0" y="0" width="860" height="380" rx="20" fill="#ffffff"/>
    
    <!-- Placeholder Canvas Text -->
    <rect x="0" y="0" width="860" height="380" rx="20" fill="none" stroke="#e7e5e4" stroke-width="2"/>
    <text x="430" y="185" font-family="'Times New Roman', Times, Georgia, serif" font-size="22" font-weight="bold" fill="#44403c" text-anchor="middle" letter-spacing="4">BOARDING PASS MOUNT AREA</text>
    <text x="430" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8a29e" text-anchor="middle" letter-spacing="1">( Overlay your horizontal HTML/CSS boarding pass card here )</text>
  </g>
</svg>
